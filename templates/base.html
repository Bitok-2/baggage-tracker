<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Digital Baggage Tracking System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body class="{% if not session.get('user_id') %}auth-body{% endif %}">
<div class="app">
    {% if session.get('user_id') %}
        <aside class="sidebar">
            <div class="brand">Baggage<span>Track</span></div>
    
            <nav>
            <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
            <a href="{{ url_for('register') }}" class="{{ 'active' if request.endpoint == 'register' }}">Register Baggage</a>
            <a href="{{ url_for('scan') }}" class="{{ 'active' if request.endpoint == 'scan' }}">RFID Scan</a>
        </nav>
        <div class="user-box">
            <p>Hello, {{ session.get('name') }}!</p>
            <form method="POST" action="{{ url_for('logout') }}">
                <button type="submit" class="btn-ghost">Logout</button>
            </form>
        </div>
        </aside>
    {% endif %}

    
    <main class="main">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</div>    
</body>
</html>
