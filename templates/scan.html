{% extends "base.html" %}

{% block title %}RFID Scan{% endblock %}

{% block content %}
    <h2>Simulated RFID Scan</h2>

    <form method="POST">
        <label for="checkpoint">Checkpoint</label>
        <select name="checkpoint" id="checkpoint">
            {% for c in checkpoints %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label for="tag_id">RFID tag ID</label>
        <input type="text" id="tag_id" name="tag_id" required>

        <button type="submit">SCAN</button>
    </form>
    
{% endblock %}
