{% extends "base.html" %}

{% block title %}RFID Scan Stations{% endblock %}

{% block content %}
    <h2 class="page-title">RFID Scan Stations</h2>
    <p class="subtitle">Scan an RFID tag at the selected checkpoint</p>

<div class="stations">
  {% for s in stations %}
  <a class="station-card" href="{{ url_for('scan_station', station=s.slug)}}">
    <span class="station-num">{{ loop.index }}</span>
    <h3>{{ s.name }}</h3>
    <p>Bag becomes <strong>{{ s.status }}</strong></p>
  </a>
  {% endfor %}
</div>
{% endblock %}
