{% extends "base.html" %}

{% block title %}Baggage Registration{% endblock %}

{% block content %}
    <h2 class="page-title">Register New Baggage</h2>
    <p class="subtitle">Fill in the details below to register a new baggage</p>
   <div class="card">
     <form method="POST">
        <label for="reference_no">Baggage reference no.</label>
        <input type="text" id="reference_no" name="reference_no" required>

        <label for="passenger_name">Passenger name</label>
        <input type="text" id="passenger_name" name="passenger_name" required>

        <label for="flight_no">Flight no.</label>
        <input type="text" id="flight_no" name="flight_no" required>

        <label for="rfid_tag_id">RFID tag ID</label>
        <input type="text" id="rfid_tag_id" name="rfid_tag_id" required>

        <button type="submit">SAVE</button>
    </form>
   </div>

    
{% endblock %}
