{% extends "base.html" %}
{% block title %}{{ checkpoint }} Station{% endblock %}
{% block content %}

<h2 class="page-title">{{ checkpoint }} Station</h2>
<p class="subtitle">Scan a tag at this checkpoint.</p>

<div class="card">
    <form method="POST">
        <label for="tag_id">RFID tag ID</label>
        <input type="text" id="tag_id" name="tag_id" value="{{ tag }}" autofocus autocomplete="off" required>
        <label class="check"><input type="checkbox" name="follow" {{ 'checked' if follow}}>Follow the bag to the next station</label>
        <button type="submit">SCAN</button>
    </form>
</div>

{% endblock %}
